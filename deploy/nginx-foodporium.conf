# /etc/nginx/sites-available/foodporium
# Foodporium only — do not reuse for other apps.
# Gunicorn listens on 8010 so it never collides with other projects on 8000.

upstream yellowfdm_gunicorn {
    server 127.0.0.1:8010 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.foodporium.in foodporium.in;

    client_max_body_size 25m;

    root /root/yellowfdm/dist;
    index index.html;

    # API + Django staff JSON under /api/admin/
    location /api/ {
        proxy_pass http://yellowfdm_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /media/ {
        alias /root/yellowfdm/backend/media/;
        expires 7d;
        access_log off;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # React SPA (includes /admin UI). Do NOT proxy /admin to another app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# /etc/nginx/sites-available/foodporium
# Linked by deploy.sh to sites-enabled

upstream yellowfdm_gunicorn {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.foodporium.in foodporium.in;

    # Certbot will replace this block with HTTPS when available
    client_max_body_size 25m;

    root /root/yellowfdm/dist;
    index index.html;

    location /api/ {
        proxy_pass http://yellowfdm_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://yellowfdm_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        alias /root/yellowfdm/backend/media/;
        expires 7d;
        access_log off;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
